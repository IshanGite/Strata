[package]
name = "strata-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
tonic = { version = "0.12", default-features = false, features = ["prost", "codegen"] }
tonic-web-wasm-client = "0.6"
prost = "0.13"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
serde_json = "1"

[build-dependencies]
tonic-build = "0.12"
protobuf-src = "1"
